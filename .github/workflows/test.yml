name: Test

on:
  push:
    branches:
      - dev
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies
        run: cargo update

      - name: Build release binary
        run: cargo build --verbose --release

      - name: Test core unit tests
        run: cargo test --package databoxer-core --lib --verbose -- --show-output

      - name: Test CLI unit tests
        run: cargo test --package databoxer-cli --lib --bins --verbose -- --show-output

      - name: Test CLI integration tests
        run: cargo test --package databoxer-cli --test test_cli --verbose -- --test-threads=1 --show-output

  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo-audit
        run: cargo audit
