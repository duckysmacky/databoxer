[workspace]
resolver = "2"
members = [
    "core",
    "cli"
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Nikita Doronin <nikdorkir@gmail.com>"]
repository = "https://github.com/duckysmacky/databoxer"

[workspace.dependencies]
databoxer-core = { version = "0.3.0", path = "core" }

# serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bincode = { version = "2.0.1", features = ["serde"] }
toml = "0.8.22"

# encryption
chacha20poly1305 = "0.10.1"
rand = "0.9.1"
sha2 = "0.10.8"
argon2 = { version = "0.5.3", features = ["std"] }

# cli
clap = { version = "4.5.38", features = ["cargo", "derive"] }

# utility
uuid = { version = "1.16.0", features = ["v4", "fast-rng"] }
thiserror = "2.0"
chrono = "0.4.41"

# unix
libc = "0.2.169"

# windows
windows-sys = { version = "0.59.0", features = ["Win32_System_Console"] }
